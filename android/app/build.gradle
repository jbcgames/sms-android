plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jbcgames.sunshine'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.jbcgames.sunshine'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DANDROID_PLATFORM=android-26',
                          '-DCMAKE_BUILD_TYPE=RelWithDebInfo',
                          '-DSMS_GLES=ON'
                targets 'sms', 'SDL2'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
